name: Publish to Comfy Registry

# Manual only: run it from the Actions tab after bumping `version` in pyproject.toml.
# Needs a REGISTRY_ACCESS_TOKEN secret (a publishing key from https://registry.comfy.org).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
